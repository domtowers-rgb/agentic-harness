<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic LLM Harness</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-head">
      <span class="brand">Agentic Harness</span>
      <button id="sidebarClose" class="icon-btn mobile-only" title="Close sidebar" aria-label="Close sidebar">✕</button>
    </div>
    <button id="newChat" class="new-chat-btn"><span aria-hidden="true">+</span> New chat</button>
    <nav id="conversationList" class="conversation-list" aria-label="Conversations"></nav>
    <button id="settingsBtn" class="sidebar-footer-btn"><span aria-hidden="true">⚙</span> Settings</button>
  </aside>
  <div id="scrim" class="scrim hidden"></div>

  <div id="settingsOverlay" class="overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">Settings</h2>
        <button id="settingsClose" class="icon-btn" title="Close" aria-label="Close">✕</button>
      </div>
      <section class="modal-section">
        <label class="field-label" for="endpoint">Model server</label>
        <div class="field-row">
          <input id="endpoint" type="text" placeholder="http://127.0.0.1:1234/v1">
          <button id="connect">Connect</button>
        </div>
        <span id="connStatus" class="status"></span>
      </section>
      <section class="modal-section">
        <div class="field-label">Tools</div>
        <div id="pluginList" class="plugin-list"></div>
        <div class="hint">Changes apply to new chats.</div>
      </section>
    </div>
  </div>

  <div class="main-panel">
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
      <select id="model" class="model-select" title="Model for new messages">
        <option value="">Default model</option>
      </select>
      <span id="connDot" class="conn-dot" title="Checking connection…"></span>
    </header>
    <main id="log" aria-live="polite"></main>
    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message…" title="Enter to send, Shift+Enter for a new line"></textarea>
        <button id="send" class="send-btn" title="Send" aria-label="Send">↑</button>
      </div>
    </footer>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
