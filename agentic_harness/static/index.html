<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic LLM Harness</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
    --bubble-user: #2563eb; --bubble-user-fg: #ffffff;
    --bubble-assistant: #f1f3f5; --bubble-assistant-fg: #1a1a1a;
    --border: #e5e7eb; --tool: #92680f; --tool-bg: #fff7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e6e6e6; --muted: #9aa0a6;
      --bubble-user: #2f5fd6; --bubble-user-fg: #ffffff;
      --bubble-assistant: #262a31; --bubble-assistant-fg: #e6e6e6;
      --border: #2c2f36; --tool: #e0b84f; --tool-bg: #33290f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  header h1 { font-size: 0.95rem; font-weight: 600; margin: 0; white-space: nowrap; }
  .controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  header select, header input[type=text] {
    flex: 1; min-width: 8rem; font-size: 0.85rem; padding: 0.35rem 0.5rem;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
  }
  header button {
    font-size: 0.8rem; padding: 0.35rem 0.6rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  header button:hover { background: var(--bubble-assistant); }
  header button:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .status.ok { color: #1a7f37; }
  .status.err { color: #b3261e; }
  main {
    flex: 1; overflow-y: auto; padding: 1rem;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .msg { max-width: 42rem; padding: 0.55rem 0.8rem; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-fg); }
  .msg.assistant { align-self: flex-start; background: var(--bubble-assistant); color: var(--bubble-assistant-fg); }
  .msg.tool { align-self: flex-start; background: var(--tool-bg); color: var(--tool); font-size: 0.8rem; font-style: italic; padding: 0.35rem 0.7rem; }
  .msg.error { align-self: flex-start; background: #fdecea; color: #b3261e; }
  .msg.pending { min-width: 2.6rem; min-height: 1.1rem; display: flex; align-items: center; }
  .turn { position: relative; align-self: flex-start; width: fit-content; max-width: 42rem; }
  .reasoning-toggle {
    position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .reasoning-toggle:hover { color: var(--fg); border-color: var(--fg); }
  .reasoning-panel {
    margin-top: 0.35rem; padding: 0.5rem 0.7rem; border-radius: 8px;
    border: 1px dashed var(--border); color: var(--muted);
    font-size: 0.78rem; font-style: italic; white-space: pre-wrap; word-wrap: break-word;
  }
  .reasoning-panel.hidden { display: none; }
  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.25;
    animation: dot-blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  footer {
    border-top: 1px solid var(--border); padding: 0.75rem 1rem;
    display: flex; gap: 0.5rem; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 0.9rem; padding: 0.55rem 0.7rem;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    max-height: 8rem;
  }
  footer button {
    font-size: 0.85rem; padding: 0.55rem 0.9rem; border-radius: 8px; border: none;
    background: var(--bubble-user); color: var(--bubble-user-fg); cursor: pointer;
  }
  footer button.stop { background: #b3261e; }
  footer button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 0.75rem; padding: 0 1rem 0.5rem; }
</style>
</head>
<body>
  <header>
    <h1>Agentic LLM Harness</h1>
    <div class="controls">
      <input id="endpoint" type="text" placeholder="API endpoint, e.g. http://127.0.0.1:1234/v1">
      <button id="connect">Connect</button>
      <span id="connStatus" class="status"></span>
    </div>
    <div class="controls">
      <select id="model">
        <option value="">(server default)</option>
      </select>
      <button id="clear">Clear chat</button>
    </div>
  </header>
  <main id="log"></main>
  <div class="hint">Enter to send &middot; Shift+Enter for newline</div>
  <footer>
    <textarea id="input" rows="1" placeholder="Message the model..."></textarea>
    <button id="send">Send</button>
  </footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelField = document.getElementById('model');
const clearBtn = document.getElementById('clear');
const endpointField = document.getElementById('endpoint');
const connectBtn = document.getElementById('connect');
const connStatus = document.getElementById('connStatus');

let history = [];
let controller = null;

async function loadModels() {
  try {
    const resp = await fetch('/v1/models');
    if (!resp.ok) return;
    const body = await resp.json();
    for (const m of body.data || []) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.id;
      modelField.appendChild(opt);
    }
  } catch {
    // no models available from the backend - keep just the default option
  }
}

async function refreshModelOptions() {
  modelField.innerHTML = '<option value="">(server default)</option>';
  await loadModels();
}
loadModels();

async function loadStatus() {
  try {
    const resp = await fetch('/v1/status');
    if (!resp.ok) return;
    const body = await resp.json();
    if (body.base_url) {
      endpointField.value = body.base_url;
      connStatus.textContent = 'connected';
      connStatus.className = 'status ok';
    } else {
      connStatus.textContent = 'using built-in mock backend';
      connStatus.className = 'status';
    }
  } catch {
    // ignore - status is informational only
  }
}
loadStatus();

async function connect() {
  const url = endpointField.value.trim();
  if (!url) return;
  connectBtn.disabled = true;
  connStatus.textContent = 'connecting…';
  connStatus.className = 'status';
  try {
    const resp = await fetch('/v1/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base_url: url }),
    });
    const body = await resp.json();
    if (!resp.ok) {
      throw new Error(body.detail || ('server returned ' + resp.status));
    }
    connStatus.textContent = 'connected';
    connStatus.className = 'status ok';
    await refreshModelOptions();
  } catch (err) {
    connStatus.textContent = 'failed: ' + err.message;
    connStatus.className = 'status err';
  } finally {
    connectBtn.disabled = false;
  }
}

connectBtn.addEventListener('click', connect);
endpointField.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    connect();
  }
});

function addBubble(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addAssistantTurn() {
  const wrapper = document.createElement('div');
  wrapper.className = 'turn';
  const bubble = document.createElement('div');
  bubble.className = 'msg assistant';
  wrapper.appendChild(bubble);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return { wrapper, bubble };
}

function addReasoningToggle(wrapper, reasoningText) {
  const toggle = document.createElement('button');
  toggle.className = 'reasoning-toggle';
  toggle.title = 'Show reasoning';
  toggle.textContent = '🧠';

  const panel = document.createElement('div');
  panel.className = 'reasoning-panel hidden';
  panel.textContent = reasoningText;

  toggle.addEventListener('click', () => {
    panel.classList.toggle('hidden');
  });

  wrapper.appendChild(toggle);
  wrapper.appendChild(panel);
}

function setTyping(el, on) {
  el.classList.toggle('pending', on);
  if (on) {
    el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  }
}

function setBusy(busy) {
  input.disabled = busy;
  sendBtn.textContent = busy ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', busy);
}

clearBtn.addEventListener('click', () => {
  history = [];
  log.innerHTML = '';
});

sendBtn.addEventListener('click', () => {
  if (controller) {
    controller.abort();
    return;
  }
  submit();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});

async function submit() {
  const text = input.value.trim();
  if (!text || controller) return;

  history.push({ role: 'user', content: text });
  addBubble('user', text);
  input.value = '';
  setBusy(true);

  const { wrapper: assistantWrapper, bubble: assistantEl } = addAssistantTurn();
  setTyping(assistantEl, true);
  let assistantText = '';
  let gotContent = false;
  let toolEl = null;
  let reasoningText = '';

  const body = { messages: history, stream: true };
  const model = modelField.value.trim();
  if (model) body.model = model;

  controller = new AbortController();
  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!resp.ok) {
      throw new Error('server returned ' + resp.status);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const line = rawEvent.trim();
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;

        let chunk;
        try {
          chunk = JSON.parse(data);
        } catch {
          continue;
        }

        if (chunk.error) {
          addBubble('error', 'Error: ' + chunk.error);
          continue;
        }

        const choice = (chunk.choices || [])[0] || {};
        const delta = choice.delta || {};

        if (delta.reasoning_content) {
          // kept hidden by default - surfaced via the reasoning-toggle icon once the turn finishes
          reasoningText += delta.reasoning_content;
        }

        if (delta.tool_calls) {
          for (const tc of delta.tool_calls) {
            const name = tc.function && tc.function.name;
            if (name && !toolEl) {
              toolEl = addBubble('tool', 'using tool: ' + name);
            }
          }
        }

        if (delta.content) {
          if (!gotContent) {
            gotContent = true;
            setTyping(assistantEl, false);
          }
          assistantText += delta.content;
          assistantEl.textContent = assistantText;
          log.scrollTop = log.scrollHeight;
          toolEl = null; // a new round of real content started
        }
      }
    }

    history.push({ role: 'assistant', content: assistantText });
  } catch (err) {
    if (err.name !== 'AbortError') {
      addBubble('error', 'Error: ' + err.message);
    }
  } finally {
    if (!gotContent) {
      setTyping(assistantEl, false);
      assistantEl.textContent = assistantText || '(no content in response)';
    }
    if (reasoningText) {
      addReasoningToggle(assistantWrapper, reasoningText);
    }
    controller = null;
    setBusy(false);
    input.focus();
  }
}
</script>
</body>
</html>
