<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic LLM Harness</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <h1>Agentic LLM Harness</h1>
    <div class="sidebar-section">
      <div class="sidebar-top-row">
        <button id="newChat" class="new-chat-btn">+ New chat</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
      </div>
      <span id="sidebarStatus" class="status"></span>
    </div>
    <div class="sidebar-section">
      <label class="field-label">Conversations</label>
      <div id="conversationList" class="conversation-list"></div>
    </div>
  </aside>
  <div id="settingsOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="settingsClose" class="icon-btn" title="Close">✕</button>
      </div>
      <div class="sidebar-section">
        <label class="field-label" for="endpoint">API endpoint</label>
        <input id="endpoint" type="text" placeholder="http://127.0.0.1:1234/v1">
        <button id="connect">Connect</button>
        <span id="connStatus" class="status"></span>
      </div>
      <div class="sidebar-section">
        <label class="field-label" for="model">Model</label>
        <select id="model">
          <option value="">(server default)</option>
        </select>
      </div>
      <div class="sidebar-section">
        <label class="field-label">Plugins</label>
        <div id="pluginList" class="plugin-list"></div>
        <div class="hint">Changes apply the next time you start a new chat.</div>
      </div>
    </div>
  </div>
  <div class="main-panel">
    <div class="topbar">
      <button id="sidebarToggle" title="Toggle sidebar">☰</button>
    </div>
    <main id="log"></main>
    <div class="hint">Enter to send &middot; Shift+Enter for newline</div>
    <footer>
      <textarea id="input" rows="1" placeholder="Message the model..."></textarea>
      <button id="send">Send</button>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
