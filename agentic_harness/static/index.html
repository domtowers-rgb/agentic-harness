<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic LLM Harness</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
    --bubble-user: #2563eb; --bubble-user-fg: #ffffff;
    --bubble-assistant: #f1f3f5; --bubble-assistant-fg: #1a1a1a;
    --border: #e5e7eb; --tool: #92680f; --tool-bg: #fff7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e6e6e6; --muted: #9aa0a6;
      --bubble-user: #2f5fd6; --bubble-user-fg: #ffffff;
      --bubble-assistant: #262a31; --bubble-assistant-fg: #e6e6e6;
      --border: #2c2f36; --tool: #e0b84f; --tool-bg: #33290f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
  }
  #sidebar {
    width: 260px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 1rem; padding: 0.9rem; overflow-y: auto;
  }
  #sidebar.collapsed { display: none; }
  #sidebar h1 { font-size: 0.95rem; font-weight: 600; margin: 0; }
  .sidebar-top-row { display: flex; gap: 0.5rem; }
  .new-chat-btn {
    flex: 1; font-size: 0.85rem; font-weight: 600; padding: 0.5rem 0.7rem; border-radius: 8px; border: none;
    background: var(--bubble-user); color: var(--bubble-user-fg); cursor: pointer; text-align: left;
  }
  .new-chat-btn:hover { opacity: 0.9; }
  .icon-btn {
    font-size: 0.95rem; width: 36px; height: 36px; flex-shrink: 0; padding: 0;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--bubble-assistant); }
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .modal {
    width: 320px; max-height: 80vh; overflow-y: auto; padding: 1rem;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
  .modal-header h2 { font-size: 0.95rem; margin: 0; }
  .plugin-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .plugin-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; cursor: pointer; }
  .plugin-row input { cursor: pointer; }
  .modal .hint { margin: 0.85rem 0 0; padding: 0; }
  .sidebar-section { display: flex; flex-direction: column; gap: 0.4rem; }
  .field-label {
    font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; color: var(--muted);
  }
  #sidebar select, #sidebar input[type=text] {
    width: 100%; font-size: 0.85rem; padding: 0.35rem 0.5rem;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
  }
  #sidebar button:not(.new-chat-btn) {
    font-size: 0.8rem; padding: 0.35rem 0.6rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  #sidebar button:hover { background: var(--bubble-assistant); }
  #sidebar button:disabled { opacity: 0.5; cursor: default; }
  .status { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .status.ok { color: #1a7f37; }
  .status.err { color: #b3261e; }
  .main-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .topbar { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  #sidebarToggle {
    font-size: 0.85rem; padding: 0.3rem 0.55rem; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); cursor: pointer;
  }
  #sidebarToggle:hover { background: var(--bubble-assistant); }
  main {
    flex: 1; overflow-y: auto; padding: 1rem;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .msg { max-width: 42rem; padding: 0.55rem 0.8rem; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-fg); }
  .msg.assistant { align-self: flex-start; background: var(--bubble-assistant); color: var(--bubble-assistant-fg); }
  .msg.tool { align-self: flex-start; background: var(--tool-bg); color: var(--tool); font-size: 0.8rem; font-style: italic; padding: 0.35rem 0.7rem; }
  .msg.error { align-self: flex-start; background: #fdecea; color: #b3261e; }
  .msg.pending { min-width: 2.6rem; min-height: 1.1rem; display: flex; align-items: center; }
  .turn { position: relative; align-self: flex-start; width: fit-content; max-width: 42rem; }
  .reasoning-toggle {
    position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .reasoning-toggle:hover { color: var(--fg); border-color: var(--fg); }
  .reasoning-panel {
    margin-top: 0.35rem; padding: 0.5rem 0.7rem; border-radius: 8px;
    border: 1px dashed var(--border); color: var(--muted);
    font-size: 0.78rem; font-style: italic; white-space: pre-wrap; word-wrap: break-word;
  }
  .reasoning-panel.hidden { display: none; }
  .dots { display: inline-flex; gap: 4px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.25;
    animation: dot-blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  footer {
    border-top: 1px solid var(--border); padding: 0.75rem 1rem;
    display: flex; gap: 0.5rem; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 0.9rem; padding: 0.55rem 0.7rem;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    max-height: 8rem;
  }
  footer button {
    font-size: 0.85rem; padding: 0.55rem 0.9rem; border-radius: 8px; border: none;
    background: var(--bubble-user); color: var(--bubble-user-fg); cursor: pointer;
  }
  footer button.stop { background: #b3261e; }
  footer button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--muted); font-size: 0.75rem; padding: 0 1rem 0.5rem; }
</style>
</head>
<body>
  <aside id="sidebar">
    <h1>Agentic LLM Harness</h1>
    <div class="sidebar-top-row">
      <button id="newChat" class="new-chat-btn">+ New chat</button>
      <button id="settingsBtn" class="icon-btn" title="Plugin settings">⚙</button>
    </div>
    <div class="sidebar-section">
      <label class="field-label" for="endpoint">API endpoint</label>
      <input id="endpoint" type="text" placeholder="http://127.0.0.1:1234/v1">
      <button id="connect">Connect</button>
      <span id="connStatus" class="status"></span>
    </div>
    <div class="sidebar-section">
      <label class="field-label" for="model">Model</label>
      <select id="model">
        <option value="">(server default)</option>
      </select>
    </div>
  </aside>
  <div id="settingsOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Plugins</h2>
        <button id="settingsClose" class="icon-btn" title="Close">✕</button>
      </div>
      <div id="pluginList" class="plugin-list"></div>
      <div class="hint">Changes apply the next time you start a new chat.</div>
    </div>
  </div>
  <div class="main-panel">
    <div class="topbar">
      <button id="sidebarToggle" title="Toggle sidebar">☰</button>
    </div>
    <main id="log"></main>
    <div class="hint">Enter to send &middot; Shift+Enter for newline</div>
    <footer>
      <textarea id="input" rows="1" placeholder="Message the model..."></textarea>
      <button id="send">Send</button>
    </footer>
  </div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelField = document.getElementById('model');
const newChatBtn = document.getElementById('newChat');
const endpointField = document.getElementById('endpoint');
const connectBtn = document.getElementById('connect');
const connStatus = document.getElementById('connStatus');
const sidebar = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');
const settingsBtn = document.getElementById('settingsBtn');
const settingsOverlay = document.getElementById('settingsOverlay');
const settingsClose = document.getElementById('settingsClose');
const pluginListEl = document.getElementById('pluginList');

sidebarToggle.addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
});

let history = [];
let controller = null;

// allPlugins: every plugin the server has loaded.
// pendingEnabled: what the settings checkboxes currently show (persisted to localStorage).
// activeEnabled: what's actually sent with requests for the current conversation -
//   only adopts pendingEnabled's value when a new chat starts, so toggling a
//   plugin mid-conversation doesn't change the tool set the model has already
//   been seeing (which would defrag any prompt-prefix caching the backend does).
let allPlugins = [];
let pendingEnabled = new Set();
let activeEnabled = new Set();

function loadEnabledFromStorage(names) {
  try {
    const saved = JSON.parse(localStorage.getItem('enabledPlugins') || 'null');
    if (Array.isArray(saved)) {
      return new Set(names.filter((n) => saved.includes(n)));
    }
  } catch {
    // ignore malformed storage - fall through to "all enabled"
  }
  return new Set(names);
}

function renderPluginList() {
  pluginListEl.innerHTML = '';
  for (const p of allPlugins) {
    const row = document.createElement('label');
    row.className = 'plugin-row';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = pendingEnabled.has(p.name);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) {
        pendingEnabled.add(p.name);
      } else {
        pendingEnabled.delete(p.name);
      }
      localStorage.setItem('enabledPlugins', JSON.stringify([...pendingEnabled]));
    });

    const label = document.createElement('span');
    label.textContent = p.name;
    label.title = p.description || '';

    row.appendChild(checkbox);
    row.appendChild(label);
    pluginListEl.appendChild(row);
  }
}

async function loadPlugins() {
  try {
    const resp = await fetch('/v1/plugins');
    if (!resp.ok) return;
    const body = await resp.json();
    allPlugins = body.plugins || [];
    pendingEnabled = loadEnabledFromStorage(allPlugins.map((p) => p.name));
    activeEnabled = new Set(pendingEnabled);
    renderPluginList();
  } catch {
    // plugin settings simply won't be available - the server will still
    // default to enabling everything since enabled_plugins is omitted
  }
}
loadPlugins();

settingsBtn.addEventListener('click', () => {
  settingsOverlay.classList.remove('hidden');
});
settingsClose.addEventListener('click', () => {
  settingsOverlay.classList.add('hidden');
});
settingsOverlay.addEventListener('click', (e) => {
  if (e.target === settingsOverlay) settingsOverlay.classList.add('hidden');
});

async function loadModels() {
  try {
    const resp = await fetch('/v1/models');
    if (!resp.ok) return;
    const body = await resp.json();
    for (const m of body.data || []) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.id;
      modelField.appendChild(opt);
    }
  } catch {
    // no models available from the backend - keep just the default option
  }
}

async function refreshModelOptions() {
  modelField.innerHTML = '<option value="">(server default)</option>';
  await loadModels();
}
loadModels();

async function loadStatus() {
  try {
    const resp = await fetch('/v1/status');
    if (!resp.ok) return;
    const body = await resp.json();
    if (body.base_url) {
      endpointField.value = body.base_url;
      connStatus.textContent = 'connected';
      connStatus.className = 'status ok';
    } else {
      connStatus.textContent = 'using built-in mock backend';
      connStatus.className = 'status';
    }
  } catch {
    // ignore - status is informational only
  }
}
loadStatus();

async function connect() {
  const url = endpointField.value.trim();
  if (!url) return;
  connectBtn.disabled = true;
  connStatus.textContent = 'connecting…';
  connStatus.className = 'status';
  try {
    const resp = await fetch('/v1/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base_url: url }),
    });
    const body = await resp.json();
    if (!resp.ok) {
      throw new Error(body.detail || ('server returned ' + resp.status));
    }
    connStatus.textContent = 'connected';
    connStatus.className = 'status ok';
    await refreshModelOptions();
  } catch (err) {
    connStatus.textContent = 'failed: ' + err.message;
    connStatus.className = 'status err';
  } finally {
    connectBtn.disabled = false;
  }
}

connectBtn.addEventListener('click', connect);
endpointField.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    connect();
  }
});

function addBubble(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addAssistantTurn() {
  const wrapper = document.createElement('div');
  wrapper.className = 'turn';
  const bubble = document.createElement('div');
  bubble.className = 'msg assistant';
  wrapper.appendChild(bubble);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return { wrapper, bubble };
}

function addReasoningToggle(wrapper, reasoningText) {
  const toggle = document.createElement('button');
  toggle.className = 'reasoning-toggle';
  toggle.title = 'Show reasoning';
  toggle.textContent = '🧠';

  const panel = document.createElement('div');
  panel.className = 'reasoning-panel hidden';
  panel.textContent = reasoningText;

  toggle.addEventListener('click', () => {
    panel.classList.toggle('hidden');
  });

  wrapper.appendChild(toggle);
  wrapper.appendChild(panel);
}

function setTyping(el, on) {
  el.classList.toggle('pending', on);
  if (on) {
    el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  }
}

function setBusy(busy) {
  input.disabled = busy;
  sendBtn.textContent = busy ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', busy);
}

newChatBtn.addEventListener('click', () => {
  if (controller) {
    controller.abort();
  }
  history = [];
  log.innerHTML = '';
  activeEnabled = new Set(pendingEnabled);
});

sendBtn.addEventListener('click', () => {
  if (controller) {
    controller.abort();
    return;
  }
  submit();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});

async function submit() {
  const text = input.value.trim();
  if (!text || controller) return;

  history.push({ role: 'user', content: text });
  addBubble('user', text);
  input.value = '';
  setBusy(true);

  const { wrapper: assistantWrapper, bubble: assistantEl } = addAssistantTurn();
  setTyping(assistantEl, true);
  let assistantText = '';
  let gotContent = false;
  let toolEl = null;
  let reasoningText = '';

  const body = { messages: history, stream: true };
  const model = modelField.value.trim();
  if (model) body.model = model;
  // Only pin down enabled_plugins once we've actually loaded the plugin list -
  // otherwise an empty set here would look like "disable everything" to the
  // server, rather than the intended "no preference, use the default".
  if (allPlugins.length) {
    body.enabled_plugins = [...activeEnabled];
  }

  controller = new AbortController();
  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!resp.ok) {
      throw new Error('server returned ' + resp.status);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const line = rawEvent.trim();
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;

        let chunk;
        try {
          chunk = JSON.parse(data);
        } catch {
          continue;
        }

        if (chunk.error) {
          addBubble('error', 'Error: ' + chunk.error);
          continue;
        }

        const choice = (chunk.choices || [])[0] || {};
        const delta = choice.delta || {};

        if (delta.reasoning_content) {
          // kept hidden by default - surfaced via the reasoning-toggle icon once the turn finishes
          reasoningText += delta.reasoning_content;
        }

        if (delta.tool_calls) {
          for (const tc of delta.tool_calls) {
            const name = tc.function && tc.function.name;
            if (name && !toolEl) {
              toolEl = addBubble('tool', 'using tool: ' + name);
            }
          }
        }

        if (delta.content) {
          if (!gotContent) {
            gotContent = true;
            setTyping(assistantEl, false);
          }
          assistantText += delta.content;
          assistantEl.textContent = assistantText;
          log.scrollTop = log.scrollHeight;
          toolEl = null; // a new round of real content started
        }
      }
    }

    history.push({ role: 'assistant', content: assistantText });
  } catch (err) {
    if (err.name !== 'AbortError') {
      addBubble('error', 'Error: ' + err.message);
    }
  } finally {
    if (!gotContent) {
      setTyping(assistantEl, false);
      assistantEl.textContent = assistantText || '(no content in response)';
    }
    if (reasoningText) {
      addReasoningToggle(assistantWrapper, reasoningText);
    }
    controller = null;
    setBusy(false);
    input.focus();
  }
}
</script>
</body>
</html>
